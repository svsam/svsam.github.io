<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="p:domain_verify" content="52413982c63f4d025687d6189e81ce64"/>
        <link rel="stylesheet" href="/css/dev.css">

        <title>/ SvS / dev </title>
        <link rel="icon" type="image/x-icon" href="/css/Images/web/site-favicon.jpg">

        <style>
            body {
                background-color: #0C0C0C;
                font-family: JetBrains Mono, monospace;
                color: #CCCCCC;
                display: flex;
                flex-direction: column;
                font-size: 1rem;
                margin: 0;
                min-height: 100vh;
                min-height: 100svh;
                font-size: 18px;
            }

            .devHeader {
                width: 100%;
            }

            .devNav {
                align-items: center;
                display: flex;
                flex-wrap: wrap;
                gap: clamp(0.75rem, 3vw, 2rem);
                justify-content: flex-start;
                padding: 0;
            }

            .devContent {
                align-items: center;
                display: flex;
                flex: 1;
                justify-content: center;
                padding: clamp(1.5rem, 6vh, 4rem) clamp(1rem, 4vw, 3rem);
            }

            .devProfile {
                align-items: center;
                display: grid;
                gap: clamp(1.5rem, 5vw, 5rem);
                grid-template-columns: repeat(2, minmax(0, 1fr));
                margin-inline: auto;
                width: min(100%, 80rem);
            }

            .devCopy {
                align-items: flex-start;
                display: flex;
                flex-direction: column;
                gap: clamp(0.75rem, 2vh, 1.5rem);
                min-width: 0;
                text-align: left;
            }

            .title {
                font-size: clamp(1.5rem, 4vw, 2rem);
                margin: 0;
                text-align: left;
                text-decoration: underline;
                text-underline-offset: 0.2em;
                width: 100%;
            }

            .devTextBox {
                aspect-ratio: 20 / 12;
                background-color: #000000;
                border: 2px solid #FFFFFF;
                box-sizing: border-box;
                min-width: 0;
                overflow: hidden;
                padding: 0;
                position: relative;
                width: 100%;
            }

            .blackHoleCanvas {
                display: block;
                height: 100%;
                image-rendering: pixelated;
                width: 100%;
            }

            .devFooter {
                padding: 0;
                text-align: left;
            }

            .homeClock {
                font-size: 12px;
                margin: 0;
                text-align: left;
            }

            .homeClock time {
                font-variant-numeric: tabular-nums;
            }

            .devDescription {
                margin: 0;
                text-align: left;
            }

            @media (max-width: 54rem) {
                .devProfile {
                    gap: 2rem;
                    grid-template-columns: minmax(0, 1fr);
                    width: min(100%, 42rem);
                }
            }

        </style>
    </head>
    
    <body>
        <main class="devContent">
            <section class="devProfile" aria-labelledby="devTitle">
                <div class="devCopy">
                    <header class="devHeader">
                        <nav class="devNav" aria-label="Primary navigation">
                            <span>Home</span>
                            <span>About</span>
                            <span>Projects</span>
                            <span>Blog</span>
                        </nav>
                    </header>

                    <h1 class="title" id="devTitle">
                        <b>SvS</b>(<i>am</i>) - Profile Type : Dev
                    </h1>

                    <p class="devDescription">
                        Physicist and hobbyist programmer.
                    </p>

                    <footer class="devFooter">
                        <p class="homeClock" role="timer" aria-live="off" aria-atomic="true">
                            My current time is: <time id="ukClock">Loading...</time>!
                        </p>
                    </footer>
                </div>

                <div
                    class="devTextBox"
                    role="img"
                    aria-label="Pixelated simulation of white particles orbiting a black hole with a dotted event horizon"
                >
                    <canvas
                        class="blackHoleCanvas"
                        id="blackHoleCanvas"
                        width="240"
                        height="144"
                        aria-hidden="true"
                    ></canvas>
                </div>
            </section>
        </main>

        <script src="/js/uk-clock.js"></script>
        <script src="/js/dev-black-hole.js"></script>
    </body>
</html>

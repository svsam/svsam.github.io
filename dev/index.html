<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="p:domain_verify" content="52413982c63f4d025687d6189e81ce64"/>
        <link rel="stylesheet" href="/css/dev.css">

        <title>/ SvS / dev </title>
        <link rel="icon" type="image/x-icon" href="/css/Images/web/site-favicon.jpg">

        <style>
            body {
            background-color: #0C0C0C;
            font-family: JetBrains Mono, monospace;
            color: #CCCCCC;
            display: flex;
            flex-direction: column;
            font-size: 1rem;
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            text-align: center;
            }

            .devHeader {
                width: 100%;
            }

            .devNav {
                align-items: center;
                display: flex;
                flex-wrap: wrap;
                gap: clamp(1rem, 5vw, 3rem);
                justify-content: center;
                padding: 1rem;
            }

            .devContent {
                align-items: center;
                display: flex;
                flex: 1;
                justify-content: flex-start;
                padding: clamp(2.5rem, 10vh, 6rem) 1rem 1rem;
            }

            .devProfile {
                align-items: center;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                width: 100%;
            }

            .title {
                margin: 0;
                text-align: center;
                text-decoration: underline;
                text-underline-offset: 0.2em;
            }

            .devTextBox {
                box-sizing: border-box;
                min-height: 10rem;
                padding: 1rem;
                text-align: center;
                width: min(100%, 42rem);
            }

            .devFooter {
                padding: 1rem;
                text-align: center;
            }

            .homeClock {
                font-size: 12px;
                margin: 0;
                text-align: center;
            }

            .homeClock time {
                font-variant-numeric: tabular-nums;
            }
        </style>
    </head>
    
    <body>
        <header class="devHeader">
            <nav class="devNav" aria-label="Primary navigation">
                <span>Home</span>
                <span>About</span>
                <span>Projects</span>
                <span>Blog</span>
            </nav>
        </header>

        <main class="devContent">
            <section class="devProfile" aria-labelledby="devTitle">
                <h1 class="title" id="devTitle">
                    <b>SvSam</b> - Profile Type : Dev
                </h1>

                <div class="devTextBox">
                    Hello!
                </div>
            </section>
        </main>

        <footer class="devFooter">
            <p class="homeClock" role="timer" aria-live="off" aria-atomic="true">
                My current time is: <time id="ukClock">Loading...</time>!
            </p>
        </footer>

        <script src="/js/uk-clock.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="p:domain_verify" content="52413982c63f4d025687d6189e81ce64"/>
        <link rel="stylesheet" href="/css/dev.css">

        <title>/ SvS / dev </title>
        <link rel="icon" type="image/x-icon" href="/css/Images/web/site-favicon.jpg">

        <style>
            body {
                background-color: #0C0C0C;
                font-family: JetBrains Mono, monospace;
                color: #CCCCCC;
                display: flex;
                flex-direction: column;
                font-size: 18px;
                margin: 0;
                min-height: 100vh;
                min-height: 100svh;
            }

            .devHeader {
                width: 100%;
            }

            .devNav {
                align-items: center;
                display: flex;
                flex-wrap: wrap;
                gap: clamp(0.975rem, 3.9vw, 2.6rem);
                justify-content: flex-start;
                padding: 0;
            }

            .devContent {
                align-items: center;
                display: flex;
                flex: 1;
                justify-content: center;
                padding: clamp(1.95rem, 7.8vh, 5.2rem) clamp(1.3rem, 5.2vw, 3.9rem);
            }

            .devProfile {
                align-items: start;
                animation: devProfileFadeIn 800ms ease-out both;
                display: grid;
                gap: clamp(1.95rem, 6.5vw, 6.5rem);
                grid-template-columns: repeat(2, minmax(0, 1fr));
                margin-inline: auto;
                width: min(100%, 104rem);
            }

            .devCopy {
                align-items: flex-start;
                display: flex;
                flex-direction: column;
                gap: clamp(0.975rem, 2.6vh, 1.95rem);
                min-width: 0;
                text-align: left;
            }

            .title {
                font-size: clamp(1.5rem, 4vw, 2rem);
                margin: 0;
                text-align: left;
                text-decoration: underline;
                text-underline-offset: 0.2em;
                width: 100%;
            }

            .devTextBox {
                aspect-ratio: 20 / 12;
                background-color: #000000;
                border: 2.6px solid #FFFFFF;
                box-sizing: border-box;
                min-width: 0;
                overflow: hidden;
                padding: 0;
                position: relative;
                width: 100%;
            }

            .blackHoleCanvas {
                display: block;
                height: 100%;
                image-rendering: pixelated;
                width: 100%;
            }

            .devFooter {
                padding: 0;
                text-align: left;
            }

            .homeClock {
                font-size: 12px;
                margin: 0;
                text-align: left;
            }

            .homeClock time {
                font-variant-numeric: tabular-nums;
            }

            .devDescription {
                margin: 0;
                text-align: left;
            }

            @keyframes devProfileFadeIn {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            @media (max-width: 54rem) {
                .devProfile {
                    gap: 2.6rem;
                    grid-template-columns: minmax(0, 1fr);
                    width: min(100%, 54.6rem);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .devProfile {
                    animation: none;
                }
            }

        </style>
    </head>
    
    <body>
        <main class="devContent">
            <section class="devProfile" aria-labelledby="devTitle">
                <div class="devCopy">
                    <header class="devHeader">
                        <nav class="devNav" aria-label="Primary navigation">
                            <a href="./">Home</a>
                            <a href="../about/">About</a>
                            <a href="../projects/">Projects</a>
                            <a href="../journal/">Journal</a>
                        </nav>
                    </header>

                    <h1 class="title" id="devTitle">
                        <b>SvS</b>(<i>am</i>) - Profile Type : Dev
                    </h1>

                    <p class="devDescription">
                        Physicist and hobbyist programmer from the United Kingdom.
                    </p>
                    <p>
                        My relevant links:
                        <br>
                        <br>
                        - my <a href="https://github.com/svsam">GitHub</a>,
                        <br>
                        - my <a href="https://www.linkedin.com/in/svssams/">LinkedIn</a>,
                        <br>
                        - my <a href="https://www.instagram.com/sam.vsse/">Instagram</a>

                    </p>

                    <footer class="devFooter">
                        <p class="homeClock" role="timer" aria-live="off" aria-atomic="true">
                            My current time is: <time id="ukClock">Loading...</time>!
                        </p>
                    </footer>
                </div>

                <div
                    class="devTextBox"
                    role="img"
                    aria-label="Pixelated simulation of white particles orbiting a black hole with a dotted event horizon"
                >
                    <canvas
                        class="blackHoleCanvas"
                        id="blackHoleCanvas"
                        width="240"
                        height="144"
                        aria-hidden="true"
                    ></canvas>
                </div>
            </section>
        </main>

        <script src="/js/uk-clock.js"></script>
        <script src="/js/dev-black-hole.js"></script>
    </body>
</html>
